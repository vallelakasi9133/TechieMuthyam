<div class="page-container">
  <h1 class="page-title">Frontend Interview Questions</h1>

  <div class="qa-container">
    <div *ngFor="let qa of questions; let i = index" class="qa-card">
      <div class="qa-header">
        <div class="qa-number">Q{{ i + 1 }}.{{ qa.question }}</div>
        <div class="qa-actions">
          <button class="btn-show" (click)="showAnswer(i)" [disabled]="qa.isViewed">
            {{ qa.isViewed ? 'Viewed' : 'Show Answer' }}
          </button>

          <button *ngIf="qa.videoUrl" class="btn-video" (click)="openVideo(qa.videoUrl)">
            🎥 Watch Video
          </button>
        </div>
      </div>

      <div *ngIf="qa.isAnswerVisible" class="qa-answer">
        <div class="typing-animation">{{ qa.answer }}</div>
      </div>
    </div>
  </div>
</div>
