<div class="refer-container">
  <p class="page-title">
    Explore Top Companies and Apply Directly Through Their Careers Pages
  </p>

  <!-- Loader -->
  <div class="loading" *ngIf="loading()">
    <div class="spinner"></div>
    <p>Loading Companies Data...</p>
  </div>

  <!-- Error Message -->
  <div class="error-message" *ngIf="error()">{{ error() }}</div>

  <!-- Company List -->
  <div class="company-list" *ngIf="!loading() && !error()">
    <div class="company-card" *ngFor="let company of companies()">
      <h2 class="company-name">{{ company.name }}</h2>
      <a
        class="careers-link"
        [href]="company.careersLink"
        target="_blank"
        rel="noopener noreferrer"
      >
        View Careers
      </a>
    </div>
  </div>
</div>
