<section class="contact-page">
  <div class="contact-container">
    <!-- Left Section: Social Links -->
    <div class="contact-info">
      <h2 class="title">Get in Touch</h2>
      <p class="subtitle">
        Have a question, suggestion, or want to collaborate?  
        Reach out via WhatsApp or Instagram — or register below.
      </p>

      <div class="social-links">
        <a href="https://chat.whatsapp.com/ENTmpuXwZfIEN5Dzn7rTQK?mode=wwt" target="_blank" class="social-btn whatsapp">
          <i class="fab fa-whatsapp"></i> Chat on WhatsApp
        </a>
        <a href="https://www.instagram.com/techiemuthyam?igsh=bWw4bmNqM2V0cGtv" target="_blank" class="social-btn instagram">
          <i class="fab fa-instagram"></i> Follow on Instagram
        </a>
         <a href="https://www.youtube.com/channel/UCH2BL45eUKFQZmJJQWwcSnQ" target="_blank" class="social-btn youtube">
          <i class="fab fa-instagram"></i> Follow on Youtube
        </a>
      </div>
    </div>

    <!-- Right Section: Registration Form -->
    <div class="contact-form">
      <h3>Register with Us</h3>
      <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" ngModel required placeholder="Enter your name" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" ngModel required placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" ngModel placeholder="Enter your number" />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" ngModel rows="4" placeholder="Write your message..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </div>
  </div>
</section>
